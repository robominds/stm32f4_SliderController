# OpenOCD configuration for STM32F407VET6 Black Board
# Typically uses ST-Link V2 or compatible debugger

# Interface configuration (ST-Link V2)
source [find interface/stlink.cfg]

# Transport selection
transport select hla_swd

# Target configuration for STM32F4x
source [find target/stm32f4x.cfg]

# Reset configuration
reset_config none

# Adapter speed
adapter speed 1000
